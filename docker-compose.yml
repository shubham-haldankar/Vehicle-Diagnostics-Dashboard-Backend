services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  backend:
    build: .
    image: vehicle-diagnostics-dashboard-backend
    container_name: backend
    depends_on:
      - postgres
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NODE_ENV: ${NODE_ENV}
      CLIENT_URL: ${CLIENT_URL}
    ports:
      - "${PORT}:${PORT}"

volumes:
  postgres-data:
